n></div>`).join('')}</div><button class="btn ghost small inline-add" type="button" onclick="addItem('links','')">+ Добавить ссылку</button></div><div class="field full"><div class="portfolio-heading"><span>Готовое портфолио <span class="muted">· необязательно</span></span><span class="help"><button type="button" class="help-button" aria-label="Зачем прикладывать готовое портфолио?" aria-expanded="false" aria-controls="portfolio-help" onclick="togglePortfolioHelp(this)" onkeydown="if(event.key==='Escape'){closePortfolioHelp(this);this.blur()}">?</button><span id="portfolio-help" class="help-text" role="tooltip">Если у вас уже есть портфолио, добавьте ссылку или файл. Анкету тоже нужно заполнить — так мы сможем подобрать для вас подходящие проекты.</span></span></div><input aria-label="Файлы портфолио" id="portfolio-files" type="file" multiple accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.jpeg,.png,.webp" onchange="addPortfolioFiles(this)"><div class="repeat-list">${draft.portfolioFiles.map((f,i)=>`<div class="link-row"><span style="align-self:center;overflow-wrap:anywhere">${esc(f.name)} <span class="muted">(${(f.size/1048576).toFixed(1)} МБ)</span></span><button class="btn ghost small" type="button" onclick="removeItem('portfolioFiles',${i})">Удалить</button></div>`).join('')}</div><div class="repeat-list">${draft.portfolioLinks.map((l,i)=>`<div class="link-row"><input type="url" aria-label="Ссылка на портфолио ${i+1}" value="${esc(l)}" placeholder="Ссылка на портфолио: https://" oninput="repeatUpdate('portfolioLinks',${i},null,this.value)"><button class="btn ghost small" type="button" onclick="removeItem('portfolioLinks',${i})" aria-label="Удалить ссылку на портфолио">×</button></div>`).join('')}</div><button class="btn ghost small inline-add" type="button" onclick="addItem('portfolioLinks','')">+ Добавить ссылку</button></div>${textField('Расскажите немного о себе','bio','Кто вы, с чем работаете и какие проекты вам интересны?')}</div>`;

я своих направлений.</div>`;

ea oninput="project(${i},'price',this.value)" placeholder="Сумма или диапазон, объём работ, сроки и что входило в стоимость">${esc(p.price)}</textarea></div></div></div>`).join('')}</div><button style="margin-top:20px" class="btn ghost" onclick="draft.projects.push({directions:[]});save();render()">+ Добавить проект</button>`}

let desc=['Анкета будет видна всем посетителям панели. Не публикуйте конфиденциальные данные.','Выберите одно или несколько направлений.','Расскажите о работе в каждом направлении.','Добавьте работы и расскажите о своём вкладе.','Всё верно?'][step];app.innerHTML=`<div class="hero"><div><div class="eyebrow">КИНОСТУДИЯ МОСКВА / КРЕАТОРЫ</div><h1>БУДЕМ СОЗДАВАТЬ<br>ИСТОРИИ ВМЕСТЕ</h1><p>Расскажите о себе и покажите свои работы.</p></div><div class="demo">ПРОТОТИП · ОТКРЫТЫЙ ДОСТУП</div></div><div class="layout"><aside class="side"><div class="side-title">АНКЕТА КРЕАТОРА</div>${steps.map((s,i)=>`<button class="step ${i===step?'active':''}" onclick="step=${i};render()"><span class="circle">${i+1}</span>${s}</button>`).join('')}<div class="side-note">Черновик сохраняется автоматически.</div></aside><section class="card"><div class="card-head"><div><h2>${steps[step]}</h2><p>${desc}</p></div><span class="badge">${step+1} / 5</span></div>${content}<div class="actions">${step?`<button class="btn ghost" onclick="step--;render();window.scrollTo(0,0)">Назад</button>`:`<span class="save-note">Черновик сохраняется автоматически</span>`}${step<4?`<button class="btn lime" onclick="step++;render();window.scrollTo(0,0)">Далее</button>`:`<button class="btn lime" onclick="submitProfile()">Сохранить анкету</button>`}</div></section></div>`}
let submitting=false;
async function submitProfile(){if(submitting)return;if(!draft.name||!contactSummary(draft)||!activeRoles().length){notify('Укажите имя, контакт и хотя бы одно направление');return}submitting=true;const submit=document.querySelector('[onclick="submitProfile()"]');if(submit)submit.disabled=true;try{let p={...structuredClone(draft),roles:activeRoles(),id:draft.id||'user-'+crypto.randomUUID(),status:'Новая заявка',rating:'',note:'',demo:false};let existing=data.find(x=>x.id===p.id);let response;if(existing){let patch={};for(const key of ['name','city','timezone','timezoneOther','contacts','links','portfolioLinks','portfolioFiles','bio','roles','details','projects','otherRoles'])if(p[key]!==undefined)patch[key]=p[key];response=await fetch(API+'/profiles/'+encodeURIComponent(p.id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)})}else response=await fetch(API+'/profiles',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});if(!response.ok)throw new Error('submit failed');draft.id=p.id;localStorage.setItem('km-demo-draft',JSON.stringify(draft));page='success';selected=null;render()}catch(err){notify('Не удалось отправить анкету. Проверьте соединение и попробуйте ещё раз.')}finally{submitting=false;if(submit)submit.disabled=false}}

const statuses=['Новая заявка','На просмотре','Общение / проверка','В пуле','Сотрудничали','Вернуться позже','Не подошёл'];let filterStatus='Все статусы',onlyShortlist=false,roleSortKey='',roleSortDirection='desc',selectedRoles=[],filterMenuOpen='';
function allSkills(p){return [p.skills||'',...Object.values(p.details||{}).flatMap(x=>[x.skills||'',x.tools||'',x.formats||'',x.supervision||''])].join(' ')}
const SCORE_WEIGHTS={quality:25,expertise:20,cinematic:15,control:20,evidence:10,leadership:10};
const CORE_SCORE_KEYS=['quality','expertise','cinematic','control','evidence'];
function metricNumber(value){if(value===undefined||value===null||value===''||value==='na')return null;let n=Number(value);return Number.isInteger(n)&&n>=1&&n<=10?n:null}
function calculateRoleTotal(person,role){const scores=person.reviews?.[role]?.scores||{};let weighted=0,weightSum=0,coreCount=0,leadership=false;for(const [key,weight] of Object.entries(SCORE_WEIGHTS)){const n=metricNumber(scores[key]?.value);if(n===null)continue;weighted+=n*weight;weightSum+=weight;if(key==='leadership')leadership=true;else coreCount++}return{value:weightSum?Math.round(weighted/weightSum*10):null,coreCount,leadership,preliminary:coreCount<CORE_SCORE_KEYS.length}}
function roleScore(p,key,role=filter){if(key==='total')return calculateRoleTotal(p,role).value;return metricNumber(p.reviews?.[role]?.scores?.[key]?.value)}
function totalCoverage(t){return `${t.coreCount}/5 критериев${t.leadership?' · управление учтено':''}`}
function miniRoleMarkup(p,r){const t=calculateRoleTotal(p,r),label=t.value===null?'Не оценено':`${t.value} / 100${t.preliminary?' · предв.':''}`,title=t.value===null?'Нет проверенных показателей':`${t.preliminary?'Предварительная оценка':'Итоговая оценка'}; оценено основных критериев: ${t.coreCount} из 5${t.leadership?', управление учтено':''}`;return `<div class="mini-role"><span>${esc(r)}</span><strong class="${t.value===null?'mini-unrated':''}" title="${esc(title)}">${esc(label)}</strong></div>`}
function totalSummaryMarkup(t){return `<div class="role-total-main"><div><span class="role-total-label">ИТОГ ПО НАПРАВЛЕНИЮ</span><div class="role-total-value">${t.value===null?'—':t.value}<small>${t.value===null?'':' / 100'}</small></div></div><div class="role-total-coverage">${t.value===null?'Оценок пока нет':`${t.preliminary?'Предварительно · ':''}${totalCoverage(t)}`}</div></div>`}
function refreshRoleTotal(person,index){const el=document.getElementById('role-total-'+index);if(!el)return;el.innerHTML=totalSummaryMarkup(calculateRoleTotal(person,person.roles[index]))}
function filteredPeople(){let people=data.filter(p=>(!selectedRoles.length||selectedRoles.every(r=>p.roles.includes(r)))&&(filterStatus==='Все статусы'||p.status===filterStatus)&&(!onlyShortlist||p.shortlisted)&&`${p.name} ${p.city||''} ${p.roles.join(' ')} ${allSkills(p)}`.toLowerCase().includes(query.trim().toLowerCase()));if(filter!=='Все направления'&&roleSortKey)people.sort((a,b)=>{let av=roleScore(a,roleSortKey),bv=roleScore(b,roleSortKey);if(av===null&&bv===null)return a.name.localeCompare(b.name,'ru');if(av===null)return 1;if(bv===null)return -1;return (roleSortDirection==='desc'?bv-av:av-bv)||a.name.localeCompare(b.name,'ru')});return people}
function sortRoleBy(key){hideCriterionTooltip();if(roleSortKey===key)roleSortDirection=roleSortDirection==='desc'?'asc':'desc';else{roleSortKey=key;roleSortDirection='desc'}renderDB();document.querySelector(`[data-sort="${key}"]`)?.focus()}
function studioOptions(selectedValue,options){return options.map(s=>`<option value="${esc(s)}" ${selectedValue===s?'selected':''}>${esc(s)}</option>`).join('')}
function creatorSlug(name){const map={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'kh',ц:'ts',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};return name.toLowerCase().split('').map(c=>map[c]??c).join('').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'creator'}
function creatorHref(p){return '?studio=1#/creator/'+creatorSlug(p.name)+'--'+encodeURIComponent(p.id)}

function renderDetail(){if(commentEditorFor!==selected){resetCommentEditor();commentEditorFor=selected}let p=data.find(x=>x.id===selected);if(!p){selected=null;render();return}let projects=p.projects?.length?p.projects:(p.project?[{name:p.project,url:p.url,contribution:p.contribution}]:[]);let details=p.details||Object.fromEntries(p.roles.map(r=>[r,{skills:p.skills,supervision:p.supervision,terms:p.terms}]));let reviews=p.reviews||{};app.innerHTML=`<div class="profile-top"><button class="back-link" onclick="goStudioBack()">‹ &nbsp; Все специалисты</button><span class="demo">ПРОТОТИП · ОТКРЫТЫЙ ДОСТУП</span></div><div class="profile-banner"><div class="profile-identity"><div class="avatar profile-avatar">${esc(p.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</div><div><div class="eyebrow">КАРТОЧКА СПЕЦИАЛИСТА ${p.demo?' · ПРИМЕР':''}</div><h1>${esc(p.name)}</h1><p>${esc(p.city||'Город не указан')}${p.timezone?' · '+esc((p.timezone==='Другое'?p.timezoneOther||'Другое':p.timezone).replaceAll('_',' ')):''}</p></div></div><button class="btn ghost shortlist-button ${p.shortlisted?'is-saved':''}" onclick="toggleShortlist()">${p.shortlisted?'★ В подборке':'☆ В подборку'}</button></div><div class="tags profile-tags">${p.roles.map(r=>`<span class="tag">${esc(r)}</span>`).join('')}</div><div class="review-layout"><div class="profile-content"><section class="review-card"><div class="review-card-heading"><div><span class="eyebrow">ПРОФИЛЬ</span><h2>О специалисте</h2></div></div><p class="profile-bio">${esc(p.bio||'Описание не заполнено')}</p><div class="contact-block"><span>Контакты</span><strong>${esc(contactSummary(p)||'Не указаны')}</strong></div>${(p.links||[]).filter(Boolean).map(l=>`<p class="detail-links">${safeLink(l)}</p>`).join('')}</section><section class="review-card"><div class="review-card-heading"><div><span class="eyebrow">РАБОТЫ</span><h2>Портфолио и проекты</h2></div><span class="review-count">ПРОЕКТЫ · ${projects.length}</span></div>${(p.portfolioLinks||[]).filter(Boolean).map(l=>`<p class="detail-links">${safeLink(l)}</p>`).join('')}${(p.portfolioFiles||[]).map((f,i)=>`<div class="portfolio-file"><span class="file-type">${esc((f.name.split('.').pop()||'ФАЙЛ').toUpperCase())}</span><span class="file-info"><strong>${esc(f.name)}</strong><small>${f.id==='demo-portfolio-pdf'?'Демонстрационный файл':'Прикреплённый файл'}</small></span><button type="button" onclick="downloadPortfolioFile(${i})">Скачать</button></div>`).join('')}${projects.length?`<div class="work-list">${projects.map(projectCard).join('')}</div>`:'<p class="unfilled">Проекты пока не добавлены.</p>'}</section><section class="review-card"><div class="review-card-heading"><div><span class="eyebrow">СПЕЦИАЛИЗАЦИЯ</span><h2>Опыт и условия</h2></div></div><div class="role-review-list">${p.roles.map((r,i)=>{let d=details[r]||{},rev=reviews[r]||{};return `<article class="role-review"><h3>${esc(r)}</h3><dl class="work-data"><dt>Опыт</dt><dd>${d.years!==undefined&&d.years!==''?esc(d.years)+' лет':'<span class="unfilled">Не указан</span>'}</dd><dt>Портфолио</dt><dd>${d.portfolio?safeLink(d.portfolio):'<span class="unfilled">Не указано</span>'}</dd><dt>Задачи</dt><dd>${studioValue(d.skills)}</dd><dt>Инструменты</dt><dd>${studioValue(d.tools)}</dd><dt>Форматы</dt><dd>${studioValue(d.formats)}</dd><dt>Руководство</dt><dd>${studioValue(d.supervision)}</dd><dt>Условия</dt><dd>${studioValue(d.terms)}</dd></dl><div class="role-evaluation"><div class="scale-title"><span>ОЦЕНКА НАПРАВЛЕНИЯ</span><span>1–10</span></div><div class="role-total-box"><div id="role-total-${i}" aria-live="polite">${totalSummaryMarkup(calculateRoleTotal(p,r))}</div><details class="weight-details"><summary>Как считается балл</summary><p>Качество — 25, экспертность — 20, кино — 15, контроль — 20, подтверждение опыта — 10, управление — 10. Непроверенные показатели исключаются из расчёта. Пока оценены не все 5 основных критериев, итог предварительный. Управление учитывается, только когда оценено.</p></details></div><p class="scale-hint">Если данных пока недостаточно, оставьте «Не проверено».</p><div class="score-grid">${roleCriteria.map(([key,label,description])=>scoreControl('role',i,key,label,description,(rev.scores||{})[key])).join('')}</div></div></article>`}).join('')}</div></section></div><aside class="review-sidebar"><section class="review-card assessment"><span class="eyebrow">ВНУТРЕННЯЯ ОЦЕНКА</span><h2>Результат отсмотра</h2><div class="field"><label id="status-label" for="status">Статус</label><div class="status-picker"><button type="button" id="status" class="status-trigger" aria-labelledby="status-label status-value" aria-haspopup="listbox" aria-expanded="false" aria-controls="status-menu" onclick="toggleStatusMenu(this)" onkeydown="statusTriggerKey(event,this)"><span id="status-value">${esc(p.status||'Новая заявка')}</span><span class="status-chevron" aria-hidden="true"></span></button><div id="status-menu" class="status-menu" role="listbox" aria-labelledby="status-label" hidden onkeydown="statusMenuKey(event)">${statuses.map((st,i)=>`<button type="button" role="option" class="status-option ${(p.status||'Новая заявка')===st?'selected':''}" aria-selected="${(p.status||'Новая заявка')===st}" tabindex="-1" onclick="chooseStatus(${i})"><span>${esc(st)}</span><span class="status-check" aria-hidden="true">✓</span></button>`).join('')}</div></div></div><div class="person-evaluation"><div class="scale-title"><span>ОБЩИЕ ОЦЕНКИ</span><span>1–10</span></div><div class="score-grid">${personalCriteria.map(([key,label,description])=>scoreControl('person',0,key,label,description,(p.personScores||{})[key])).join('')}</div></div><div class="team-section"><div class="team-heading"><h3>Совместные проекты</h3><span>${(p.collaborations||[]).length}</span></div><p class="hint">Проекты, над которыми работали вместе.</p>${(p.collaborations||[]).length?`<div class="collab-list">${p.collaborations.map((c,i)=>`<div class="collab-item"><span>${esc(c.name)}</span><button type="button" aria-label="Удалить проект ${esc(c.name)}" onclick="removeCollaboration(${i})">×</button></div>`).join('')}</div>`:'<p class="section-placeholder">Пока нет проектов</p>'}<div class="collab-add"><input id="collab-input" aria-label="Название совместного проекта" placeholder="Название проекта" onkeydown="if(event.key==='Enter'){event.preventDefault();addCollaboration()}"><button type="button" class="btn ghost small" aria-label="Добавить совместный проект" onclick="addCollaboration()">+</button></div></div><p class="saved-note"><span id="sync-status">Сохраняется автоматически</span></p></section></aside></div><section class="review-card comments-section"><div class="team-heading"><h2>Комментарии команды</h2><span>${getTeamNotes(p).length}</span></div><div class="comment-compose"><textarea id="team-note-input" aria-label="${commentEditIndex===null?'Новый комментарий команды':'Изменить комментарий'}" placeholder="Напишите комментарий" oninput="commentTextDraft=this.value">${esc(commentTextDraft)}</textarea><div id="comment-pending-files" class="comment-pending-files">${pendingCommentMarkup()}</div><div class="comment-compose-actions"><label class="comment-attach" for="comment-file-input">+ Фото или файл</label><input id="comment-file-input" class="comment-file-input" type="file" multiple onchange="addCommentFiles(this)"><div class="comment-action-buttons">${commentEditIndex!==null?`<button type="button" class="btn ghost small" onclick="cancelCommentEdit()">Отмена</button>`:''}<button type="button" class="btn ghost small team-add" onclick="addTeamNote()">${commentEditIndex===null?'Добавить комментарий':'Сохранить'}</button></div></div></div><div class="comments-list">${getTeamNotes(p).length?getTeamNotes(p).map((n,i)=>({n,i})).reverse().map(({n,i})=>`<article class="comment-item"><div class="comment-avatar" aria-hidden="true">К</div><div class="comment-body"><div class="comment-meta"><strong>Команда</strong><time>${esc(formatNoteDate(n.date))}</time>${n.editedAt?'<span class="comment-edited">изменено</span>':''}</div>${n.text?`<p>${esc(n.text)}</p>`:''}${(n.files||[]).length?`<div class="comment-file-list">${n.files.map((f,j)=>`<button type="button" class="comment-file" onclick="downloadCommentFile(${i},${j})" aria-label="Скачать файл ${esc(f.name)}">${esc(f.name)}</button>`).join('')}</div>`:''}<div class="comment-controls"><button type="button" onclick="editTeamNote(${i})">Изменить</button><button type="button" onclick="deleteTeamNote(${i})">Удалить</button></div></div></article>`).join(''):'<p class="section-placeholder">Пока нет комментариев</p>'}</div></section>`}
function toggleStatusMenu(trigger,force){const menu=document.getElementById('status-menu'),open=force??menu.hidden;if(open){const rect=trigger.getBoundingClientRect();trigger.parentElement.classList.toggle('open-up',window.innerHeight-rect.bottom<320&&rect.top>window.innerHeight-rect.bottom)}menu.hidden=!open;trigger.setAttribute('aria-expanded',String(open))}
function chooseStatus(index){if(index<0||index>=statuses.length)return;const status=statuses[index];updatePerson('status',status);document.getElementById('status-value').textContent=status;document.querySelectorAll('.status-option').forEach((el,i)=>{el.classList.toggle('selected',i===index);el.setAttribute('aria-selected',String(i===index))});let trigger=document.getElementById('status');toggleStatusMenu(trigger,false);trigger.focus()}
function statusTriggerKey(event,trigger){if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();toggleStatusMenu(trigger,true);let selected=document.querySelector('.status-option[aria-selected="true"]');(selected||document.querySelector('.status-option'))?.focus()}else if(event.key==='Escape'){toggleStatusMenu(trigger,false)}}
function statusMenuKey(event){const opts=Array.from(document.querySelectorAll('.status-option')),i=opts.indexOf(document.activeElement);if(event.key==='Escape'){event.preventDefault();let trigger=document.getElementById('status');toggleStatusMenu(trigger,false);trigger.focus()}else if(event.key==='ArrowDown'||event.key==='ArrowUp'||event.key==='Home'||event.key==='End'){event.preventDefault();let next=event.key==='Home'?0:event.key==='End'?opts.length-1:(i+(event.key==='ArrowDown'?1:-1)+opts.length)%opts.length;opts[next]?.focus()}else if(event.key==='Tab'){toggleStatusMenu(document.getElementById('status'),false)}}
document.addEventListener('click',event=>{if(!event.target.closest('.status-picker')){const trigger=document.getElementById('status');if(trigger&&trigger.getAttribute('aria-expanded')==='true')toggleStatusMenu(trigger,false)}});
let commentEditorFor=null,commentEditIndex=null,commentTextDraft='',pendingCommentFiles=[];
function resetCommentEditor(){commentEditIndex=null;commentTextDraft='';pendingCommentFiles=[]}
function getTeamNotes(p){if(Array.isArray(p.teamNotes))return p.teamNotes;return p.note?.trim()?[{text:p.note,date:null}]:[]}
function formatNoteDate(date){if(!date)return 'Дата не указана';let d=new Date(date);return Number.isNaN(d.getTime())?'Дата не указана':new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d)}
function pendingCommentMarkup(){return pendingCommentFiles.map((f,i)=>`<span class="comment-pending"><span>${esc(f.name)}</span><button type="button" aria-label="Убрать файл ${esc(f.name)}" onclick="removePendingCommentFile(${i})">×</button></span>`).join('')}
function refreshPendingCommentFiles(){let el=document.getElementById('comment-pending-files');if(el)el.innerHTML=pendingCommentMarkup()}
function removePendingCommentFile(index){pendingCommentFiles.splice(index,1);refreshPendingCommentFiles()}
async function addCommentFiles(input){const files=Array.from(input.files);input.value='';let added=0,tooLarge=0,failed=0;for(const file of files){if(file.size>30*1024*1024){tooLarge++;continue}try{const id=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();await portfolioWrite(id,file);pendingCommentFiles.push({id:uploadIds.get(id),name:file.name,size:file.size,type:file.type||''});added++}catch(e){failed++}}refreshPendingCommentFiles();if(tooLarge||failed)notify(`${tooLarge?'Файлы больше 30 МБ не добавлены. ':''}${failed?'Не удалось сохранить некоторые файлы. ':''}Добавлено: ${added}.`);else if(added)notify('Файлы добавлены')}
async function downloadCommentFile(noteIndex,fileIndex){const p=data.find(x=>x.id===selected),fileInfo=p&&getTeamNotes(p)[noteIndex]?.files?.[fileIndex];if(!fileInfo)return;try{const file=await portfolioRead(fileInfo.id);if(!file){notify('Файл недоступен в этом браузере');return}const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=fileInfo.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){notify('Не удалось открыть файл в этом браузере')}}
function editTeamNote(index){const p=data.find(x=>x.id===selected),note=p&&getTeamNotes(p)[index];if(!note)return;commentEditIndex=index;commentTextDraft=note.text||'';pendingCommentFiles=(note.files||[]).map(f=>({...f}));renderDetail();document.getElementById('team-note-input')?.focus()}
function cancelCommentEdit(){resetCommentEditor();renderDetail();document.getElementById('team-note-input')?.focus()}
function deleteTeamNote(index){const p=data.find(x=>x.id===selected);if(!p)return;const notes=[...getTeamNotes(p)];if(index<0||index>=notes.length)return;notes.splice(index,1);p.teamNotes=notes;if(commentEditIndex===index)resetCommentEditor();else if(commentEditIndex!==null&&index<commentEditIndex)commentEditIndex--;save();renderDetail()}
function addTeamNote(){let p=data.find(x=>x.id===selected),el=document.getElementById('team-note-input');if(!p||!el)return;let text=el.value.trim();if(!text&&!pendingCommentFiles.length){el.focus();return}let notes=[...getTeamNotes(p)];if(commentEditIndex!==null){if(!notes[commentEditIndex])return;notes[commentEditIndex]={...notes[commentEditIndex],text,files:pendingCommentFiles.map(f=>({...f})),editedAt:new Date().toISOString()}}else notes.push({text,date:new Date().toISOString(),files:pendingCommentFiles.map(f=>({...f}))});p.teamNotes=notes;resetCommentEditor();save();renderDetail()}
function addCollaboration(){let p=data.find(x=>x.id===selected),el=document.getElementById('collab-input');if(!p||!el)return;let name=el.value.trim();if(!name){el.focus();return}p.collaborations??=[];p.collaborations.push({name,date:new Date().toISOString()});save();renderDetail()}
function removeCollaboration(index){let p=data.find(x=>x.id===selected);if(!p||!Array.isArray(p.collaborations))return;p.collaborations.splice(index,1);save();renderDetail()}
function updatePerson(k,v){let p=data.find(x=>x.id===selected);if(!p)return;p[k]=v;p.reviewedAt=new Date().toISOString();save()}
function updateRoleReview(i,k,v){let p=data.find(x=>x.id===selected);if(!p||!p.roles[i])return;p.reviews??={};p.reviews[p.roles[i]]??={};p.reviews[p.roles[i]][k]=v;p.reviewedAt=new Date().toISOString();save()}
function toggleShortlist(){let p=data.find(x=>x.id===selected);if(!p)return;p.shortlisted=!p.shortlisted;save();render()}
const API='https://api-creators.xn--d1ahbfqgvij6j.xn--80adxhks/api';
const uploadIds=new Map();let serverReady=false,lastSynced=new Map(),pendingPatches=new Map(),syncTimer=null,syncBusy=false;
const SHARED_FIELDS=['status','reviews','personScores','teamNotes','collaborations','shortlisted','reviewedAt'];
function updateSyncState(text){let el=document.getElementById('sync-status');if(el)el.textContent=text}
function queueStudioChanges(){for(const person of data){const old=lastSynced.get(person.id);if(!old)continue;let patch=pendingPatches.get(person.id)||{};let changed=false;for(const key of SHARED_FIELDS){if(JSON.stringify(person[key])!==JSON.stringify(old[key])){patch[key]=structuredClone(person[key]??null);old[key]=structuredClone(person[key]??null);changed=true}}if(changed)pendingPatches.set(person.id,patch)}if(pendingPatches.size){updateSyncState('Сохраняем…');clearTimeout(syncTimer);syncTimer=setTimeout(flushStudioChanges,500)}}
async function flushStudioChanges(){if(syncBusy)return;syncBusy=true;try{while(pendingPatches.size){const [id,patch]=pendingPatches.entries().next().value;pendingPatches.delete(id);try{const response=await fetch(API+'/profiles/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});if(!response.ok)throw new Error('save failed')}catch(err){pendingPatches.set(id,{...patch,...(pendingPatches.get(id)||{})});updateSyncState('Не сохранено — проверьте соединение');notify('Изменения пока не сохранены. Проверьте соединение.');return}}updateSyncState('Сохранено')}finally{syncBusy=false}}
window.addEventListener('online',()=>{if(pendingPatches.size)flushStudioChanges()});window.addEventListener('beforeunload',e=>{if(pendingPatches.size||syncBusy){e.preventDefault();e.returnValue=''}});
async function bootShared(){app.innerHTML='<p class="hint">Загружаем данные…</p>';try{let response=await fetch(API+'/profiles',{cache:'no-store'});if(!response.ok)throw new Error('load failed');let remote=await response.json();if(!Array.isArray(remote))throw new Error('invalid data');const examples=data.filter(p=>p.demo);let seed=await fetch(API+'/seed',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(examples)});if(!seed.ok)throw new Error('seed failed');response=await fetch(API+'/profiles',{cache:'no-store'});if(!response.ok)throw new Error('load failed');data=await response.json();for(const p of data)lastSynced.set(p.id,structuredClone(p));serverReady=true;if(page==='db')selected=routeCreatorId();render()}catch(err){app.innerHTML='<div class="empty">Не удалось подключиться к базе. Проверьте соединение и обновите страницу.</div>'}}
bootShared();

</script></body></html>
